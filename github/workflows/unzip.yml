name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q otlob-abis-ready-to-deploy.zip
          shopt -s dotglob
          mv otlob-abis-central-release/* .
          rmdir otlob-abis-central-release
          rm otlob-abis-ready-to-deploy.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
