name: web-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_URL_BACKUP: ${{ vars.EXPO_PUBLIC_API_URL_BACKUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Open the built site in a real browser and print what happens
        run: |
          npm i --no-save playwright@1.49.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (npx --yes serve -s dist -l 4173 >/dev/null 2>&1 &)
          sleep 6
          cat > /tmp/check.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 400, height: 860 } });
            p.on('pageerror', (e) => console.log('PAGEERROR:', String(e.stack || e).slice(0, 700)));
            p.on('console', (m) => { if (m.type() === 'error') console.log('CONSOLE_ERROR:', m.text().slice(0, 300)); });
            p.on('requestfailed', (r) => console.log('REQFAIL:', r.url().slice(0, 120)));
            await p.route('https://api.otlobabis.com/**', async (route) => {
              try {
                const r = await route.fetch();
                if (/\/api\/settings(\?|$)/.test(route.request().url())) {
                  const j = await r.json();
                  const patch = (o) => { if (o && typeof o === 'object') { o.features = { ...(o.features || {}), guestBrowse: true }; } };
                  patch(j); patch(j.settings);
                  await route.fulfill({ status: 200, contentType: 'application/json', headers: { 'access-control-allow-origin': '*' }, body: JSON.stringify(j) });
                  return;
                }
                await route.fulfill({ response: r, headers: { ...r.headers(), 'access-control-allow-origin': '*', 'access-control-allow-headers': '*', 'access-control-allow-methods': '*' } });
              } catch (e) { await route.abort(); }
            });
            await p.goto('http://localhost:4173', { waitUntil: 'load' });
            await p.waitForTimeout(12000);
            console.log('BOOT_STILL_THERE:', await p.evaluate(() => !!document.getElementById('boot')));
            console.log('TEXT:', (await p.evaluate(() => document.body.innerText)).slice(0, 500).replace(/\n/g, ' | '));
            try { await p.getByText('ابدأ الآن').first().click({ timeout: 4000 }); } catch (e) { console.log('NO_START_BUTTON'); }
            await p.waitForTimeout(8000);
            console.log('AFTER_START_BOOT:', await p.evaluate(() => !!document.getElementById('boot')));
            console.log('AFTER_START_TEXT:', (await p.evaluate(() => document.body.innerText)).slice(0, 700).replace(/\n/g, ' | '));
            await b.close();
          })();
          EOF
          cp /tmp/check.js ./check.js && node check.js
