name: web-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_URL_BACKUP: ${{ vars.EXPO_PUBLIC_API_URL_BACKUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Open the built site in a real browser and print what happens
        run: |
          npm i --no-save playwright@1.49.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (npx --yes serve -s dist -l 4173 >/dev/null 2>&1 &)
          sleep 6
          cat > /tmp/check.js <<'EOF'
          const { chromium } = require('playwright');
          const walk = (o) => { if (o && typeof o === 'object') { if (o.features && typeof o.features === 'object' && !Array.isArray(o.features)) { o.features.guestBrowse = true; } for (const k of Object.keys(o)) walk(o[k]); } };
          (async () => {
            const b = await chromium.launch();
            for (const homeNew of [true, false]) {
              const p = await b.newPage({ viewport: { width: 400, height: 860 } });
              p.on('pageerror', (e) => console.log('PAGEERROR:', String(e.stack || e).slice(0, 700)));
              await p.route('https://api.otlobabis.com/**', async (route) => {
                try {
                  const r = await route.fetch();
                  const ct = r.headers()['content-type'] || '';
                  if (ct.includes('json')) {
                    let j; try { j = await r.json(); } catch (e) { return route.fulfill({ response: r, headers: { ...r.headers(), 'access-control-allow-origin': '*' } }); }
                    walk(j);
                    return route.fulfill({ status: r.status(), contentType: 'application/json', headers: { 'access-control-allow-origin': '*', 'access-control-allow-headers': '*' }, body: JSON.stringify(j) });
                  }
                  return route.fulfill({ response: r, headers: { ...r.headers(), 'access-control-allow-origin': '*', 'access-control-allow-headers': '*' } });
                } catch (e) { await route.abort(); }
              });
              await p.goto('http://localhost:4173', { waitUntil: 'load' });
              await p.waitForTimeout(9000);
              try { await p.getByText('ابدأ الآن').first().click({ timeout: 3000 }); } catch (e) {}
              await p.waitForTimeout(9000);
              console.log('RESULT_' + homeNew + '_BOOT:', await p.evaluate(() => !!document.getElementById('boot')));
              console.log('RESULT_' + homeNew + '_TEXT:', (await p.evaluate(() => document.body.innerText)).slice(0, 600).replace(/\n/g, ' | '));
              await p.close();
            }
            await b.close();
          })();
          EOF
          cp /tmp/check.js ./check.js && node check.js
